name: WarmCache
options:
  bundleIdPrefix: com.christrinh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Set to your Apple Developer Team ID. Required for a device build; a free
    # personal team cannot carry the Push Notifications entitlement.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  WarmCache:
    type: application
    platform: iOS
    sources:
      - path: WarmCache
    # Per-configuration endpoint and API key, substituted into Info.plist and the
    # entitlements file. Config/Secrets.xcconfig is gitignored; the includes in
    # Debug/Release are optional so a fresh clone still builds.
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.christrinh.warmcache
        INFOPLIST_FILE: WarmCache/Info.plist
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        TARGETED_DEVICE_FAMILY: "1"
        # Dark mode only — light mode is explicitly out of scope.
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: WarmCache/WarmCache.entitlements
      properties:
        # Driven by the xcconfig so it cannot drift from the server's
        # APNS_USE_SANDBOX: development <-> true, production <-> false.
        aps-environment: $(WC_APS_ENVIRONMENT)

  WarmCacheTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WarmCacheTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.christrinh.warmcache.tests
    dependencies:
      - target: WarmCache

# XcodeGen writes no shared scheme unless one is declared, which makes
# `xcodebuild -scheme WarmCache` after a clean `xcodegen generate` fragile.
schemes:
  WarmCache:
    build:
      targets:
        WarmCache: all
        WarmCacheTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WarmCacheTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
