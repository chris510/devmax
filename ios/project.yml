name: WarmCache
options:
  bundleIdPrefix: com.christrinh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  WarmCache:
    type: application
    platform: iOS
    sources:
      - path: WarmCache
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.christrinh.warmcache
        INFOPLIST_FILE: WarmCache/Info.plist
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        TARGETED_DEVICE_FAMILY: "1"
        # Dark mode only — light mode is explicitly out of scope.
        SUPPORTS_MACCATALYST: NO
    entitlements:
      path: WarmCache/WarmCache.entitlements
      properties:
        aps-environment: development

  WarmCacheTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WarmCacheTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.christrinh.warmcache.tests
    dependencies:
      - target: WarmCache
