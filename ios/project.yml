name: Devmax
options:
  bundleIdPrefix: com.christrinh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  FounderMigration: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    # One Percent Studios LLC. Required for a device build; a free personal
    # team cannot carry the Push Notifications entitlement.
    DEVELOPMENT_TEAM: "BSM3G2L4RK"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "9"

targets:
  Devmax:
    type: application
    platform: iOS
    sources:
      - path: Devmax
    # Per-configuration endpoint and optional direct-device claim token,
    # substituted into Info.plist and the entitlements file.
    # Config/Secrets.xcconfig is gitignored; Release force-clears both supported
    # secret settings after the include so a local file cannot leak into an archive.
    configFiles:
      Debug: Config/Debug.xcconfig
      FounderMigration: Config/FounderMigration.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.christrinh.devmax
        INFOPLIST_FILE: Devmax/Info.plist
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        TARGETED_DEVICE_FAMILY: "1"
        # The shipped handoff is dark-only; light mode remains explicitly out of scope.
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Devmax/Devmax.entitlements
      properties:
        # Driven by the xcconfig so it cannot drift from the server's
        # APNS_USE_SANDBOX: development <-> true, production <-> false.
        aps-environment: $(WC_APS_ENVIRONMENT)
        com.apple.developer.applesignin:
          - Default

  DevmaxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DevmaxTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.christrinh.devmax.tests
    dependencies:
      - target: Devmax

  DevmaxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DevmaxUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.christrinh.devmax.uitests
    dependencies:
      - target: Devmax

# XcodeGen writes no shared scheme unless one is declared, which makes
# `xcodebuild -scheme Devmax` after a clean `xcodegen generate` fragile.
schemes:
  Devmax:
    build:
      targets:
        Devmax: all
        DevmaxTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DevmaxTests
        - DevmaxUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  DevmaxFounderMigration:
    build:
      targets:
        Devmax: all
        DevmaxTests: [test]
    run:
      config: FounderMigration
    test:
      config: FounderMigration
      targets:
        - DevmaxTests
    analyze:
      config: FounderMigration
    # An accidental Archive on this scheme must still use the keyless Release
    # configuration; FounderMigration is only for a direct-device Run.
    archive:
      config: Release
