name: Check missed reviews

on:
  schedule:
    # Offset so this never lands on the same minute as a trigger-review poll —
    # purely to keep the two jobs off the same row, not for correctness. It used
    # to be load-bearing: check-missed cleared last_pushed_at, which is the
    # evidence trigger-review counts against reviews_per_day. Migration 0004
    # moved that erasure to missed_counted_at, so the two no longer contend.
    - cron: '35 */4 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: POST /internal/check-missed
        run: |
          body=$(curl -sS --fail-with-body \
            --retry 3 --retry-connrefused --retry-delay 5 --max-time 60 \
            -X POST "$API_BASE_URL/internal/check-missed" \
            -H "X-Cron-Secret: $CRON_SECRET")
          echo "$body"
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
