name: Trigger review push

on:
  # Production polling lives on the short-lived Railway cron service defined by
  # api/railway.trigger-review.json. Keep this manual path as an independent
  # fallback, but never schedule both providers or every notification window gets
  # duplicate poll traffic.
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      # Retries cover the double cold start of a sleeping container plus a
      # database waking from idle.
      - name: POST /internal/trigger-review
        run: |
          body=$(curl -sS --fail-with-body \
            --retry 3 --retry-connrefused --retry-delay 5 --max-time 60 \
            -X POST "$API_BASE_URL/internal/trigger-review" \
            -H "X-Cron-Secret: $CRON_SECRET")
          echo "$body"

          # The only reason worth surfacing. outside_window, already_pushed,
          # daily_limit and nothing_due are all routine poll responses;
          # no_devices means the phone or APNs is misconfigured and no push will
          # arrive until someone looks. A non-2xx still fails the job through
          # --fail-with-body, which is the real breakage signal now.
          if [ "$(printf '%s' "$body" | jq -r '.reason // empty')" = "no_devices" ]; then
            echo "::warning::Nothing delivered — no registered device token, or the \
          APNs credentials are not configured on the app."
          fi
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
