name: Trigger review push

on:
  # Production polling lives inside the single-replica API process. Keep this
  # manual path as an independent fallback, but do not restore a schedule here or
  # every notification window gets duplicate poll traffic.
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      # Retries cover the double cold start of a sleeping container plus a
      # database waking from idle.
      - name: POST /internal/trigger-review
        run: |
          body=$(curl -sS --fail-with-body \
            --retry 3 --retry-connrefused --retry-delay 5 --max-time 60 \
            -X POST "$API_BASE_URL/internal/trigger-review" \
            -H "X-Cron-Secret: $CRON_SECRET")
          echo "$body"

          # The only reason worth surfacing. outside_window, already_pushed,
          # daily_limit and nothing_due are all routine poll responses;
          # no_devices means the phone or APNs is misconfigured and no push will
          # arrive until someone looks. A non-2xx still fails the job through
          # --fail-with-body, which is the real breakage signal now.
          reason=$(printf '%s' "$body" | jq -r '.reason // empty')
          failed_count=$(printf '%s' "$body" | jq -r '.failed_count // 0')
          no_devices_count=$(printf '%s' "$body" | jq -r '.reasons.no_devices // 0')
          delivery_failed_count=$(printf '%s' "$body" | jq -r '.reasons.delivery_failed // 0')
          if [ "$reason" = "no_devices" ] || [ "$reason" = "delivery_failed" ]; then
            echo "::warning::Nothing delivered — inspect device registration and APNs."
          elif [ "$no_devices_count" -gt 0 ] || [ "$delivery_failed_count" -gt 0 ]; then
            echo "::warning::$no_devices_count accounts had no devices and $delivery_failed_count had delivery failures."
          elif [ "$failed_count" -gt 0 ]; then
            echo "::warning::$failed_count account review evaluations failed."
          fi
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
