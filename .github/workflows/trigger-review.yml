name: Trigger review push

on:
  schedule:
    # GitHub cron is UTC and does not observe DST, but the notification windows are
    # local (America/Los_Angeles) and do. Morning therefore uses a paired trigger:
    # 17:00 UTC is 10:00 PDT / 09:00 PST, while 18:00 UTC is 11:00 PDT / 10:00 PST.
    # The backend's narrow 09:20-10:40 window accepts exactly one of them. The other
    # returns outside_window as an expected no-op.
    #
    # Evening keeps one fixed trigger because its 90-minute window is wider than
    # the DST shift: 05:10 UTC is 22:10 PDT / 21:10 PST.
    - cron: '0 17 * * *'    # 10:00 PDT / 09:00 PST
    - cron: '0 18 * * *'    # 11:00 PDT / 10:00 PST
    - cron: '10 5 * * *'    # 22:10 PDT / 21:10 PST
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      # The endpoint validates the notification window itself, so a late trigger
      # either still lands in-window or correctly no-ops. Retries cover the double
      # cold start of a sleeping container plus a database waking from idle.
      - name: POST /internal/trigger-review
        run: |
          body=$(curl -sS --fail-with-body \
            --retry 3 --retry-connrefused --retry-delay 5 --max-time 60 \
            -X POST "$API_BASE_URL/internal/trigger-review" \
            -H "X-Cron-Secret: $CRON_SECRET")
          echo "$body"

          reason=$(printf '%s' "$body" | jq -r '.reason // empty')
          case "$reason" in
            outside_window)
              case "$SCHEDULE" in
                '0 17 * * *'|'0 18 * * *')
                  echo "Expected DST companion no-op outside the 10:00 local window."
                  ;;
                *)
                  echo "::error::Fired outside every notification window. The cron schedule \
          and the windows in PUT /settings no longer agree — see the comment above the \
          schedule in this file."
                  exit 1
                  ;;
              esac
              ;;
            no_devices)
              echo "::warning::Nothing delivered — no registered device token, or the \
          APNs credentials are not configured on the app."
              ;;
          esac
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
