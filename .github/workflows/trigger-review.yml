name: Trigger review push

on:
  schedule:
    # Deliberately dumb. The notification windows, the timezone they are read in,
    # and the daily budget all live in the settings row, so this schedule's only
    # job is to poll often enough that an edit in the app takes effect within one
    # interval — no DST arithmetic, no commit, no redeploy. It used to carry a
    # hand-maintained UTC approximation of those windows, which disagreed with
    # them for four months of every year; see docs/DEVIATIONS.md §1.
    #
    # Most fires land outside every window and return
    # {"sent": false, "reason": "outside_window"}. That is the expected steady
    # state, not a failure. The endpoint sends at most one push per window.
    #
    # Offset off :00/:30 because GitHub queues scheduled runs behind everyone
    # else's top-of-the-hour crons and drops them under load.
    - cron: '7,37 * * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      # Retries cover the double cold start of a sleeping container plus a
      # database waking from idle.
      - name: POST /internal/trigger-review
        run: |
          body=$(curl -sS --fail-with-body \
            --retry 3 --retry-connrefused --retry-delay 5 --max-time 60 \
            -X POST "$API_BASE_URL/internal/trigger-review" \
            -H "X-Cron-Secret: $CRON_SECRET")
          echo "$body"

          # The only reason worth surfacing. outside_window, already_pushed,
          # daily_limit and nothing_due are all routine at a 30-minute poll;
          # no_devices means the phone or APNs is misconfigured and no push will
          # arrive until someone looks. A non-2xx still fails the job through
          # --fail-with-body, which is the real breakage signal now.
          if [ "$(printf '%s' "$body" | jq -r '.reason // empty')" = "no_devices" ]; then
            echo "::warning::Nothing delivered — no registered device token, or the \
          APNs credentials are not configured on the app."
          fi
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
