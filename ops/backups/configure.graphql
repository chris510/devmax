# Configure only the dedicated backup service. Unlike legacy api/railway.json,
# new services cannot opt into Railway's deprecated Config as Code format.
mutation ConfigureBackup($serviceId: String!, $environmentId: String!) {
  schedule: serviceInstanceUpdate(
    serviceId: $serviceId
    environmentId: $environmentId
    input: {
      cronSchedule: "0 10 * * *"
      numReplicas: 1
    }
  )
  # Railway resets the restart policy to NEVER when cronSchedule is supplied,
  # even if the same input also requests ON_FAILURE. Root mutation fields run
  # serially: apply the retry policy after configuring the schedule.
  retryPolicy: serviceInstanceUpdate(
    serviceId: $serviceId
    environmentId: $environmentId
    input: { restartPolicyType: ON_FAILURE, restartPolicyMaxRetries: 2 }
  )
}
